<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Dream Wedding Day - AI-Powered Wedding Planning</title>
    <meta name="title" content="Dream Wedding Day - AI-Powered Wedding Planning" />
    <meta name="description" content="Create unforgettable memories with AI-powered photo analysis, seamless RSVP management, and real-time coordination tools. Plan the wedding of your dreams." />
    <meta name="keywords" content="wedding planning, RSVP management, wedding photos, AI photo analysis, wedding coordination" />
    <meta name="author" content="Dream Wedding Day" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dreamweddingday.com/" />
    <meta property="og:title" content="Dream Wedding Day - AI-Powered Wedding Planning" />
    <meta property="og:description" content="Create unforgettable memories with AI-powered photo analysis, seamless RSVP management, and real-time coordination tools." />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://dreamweddingday.com/" />
    <meta property="twitter:title" content="Dream Wedding Day - AI-Powered Wedding Planning" />
    <meta property="twitter:description" content="Create unforgettable memories with AI-powered photo analysis, seamless RSVP management, and real-time coordination tools." />
    <meta property="twitter:image" content="/og-image.png" />

    <!-- Theme Color for Mobile Browsers -->
    <meta name="theme-color" content="#ec4899" />

    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
