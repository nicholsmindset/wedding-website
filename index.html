<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Dream Wedding Day - AI-Powered Wedding Planning Platform</title>
    <meta name="title" content="Dream Wedding Day - AI-Powered Wedding Planning Platform" />
    <meta name="description" content="Plan your perfect wedding with AI-powered photo analysis, seamless RSVP management, and real-time coordination tools. Create unforgettable memories with Dream Wedding Day." />
    <meta name="keywords" content="wedding planning, wedding planner, RSVP management, wedding photos, AI photo analysis, wedding coordination, wedding timeline, guest management" />
    <meta name="author" content="Dream Wedding Day" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://dreamweddingday.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dreamweddingday.com/" />
    <meta property="og:title" content="Dream Wedding Day - AI-Powered Wedding Planning Platform" />
    <meta property="og:description" content="Plan your perfect wedding with AI-powered photo analysis, seamless RSVP management, and real-time coordination tools." />
    <meta property="og:image" content="https://dreamweddingday.com/og-image.jpg" />
    <meta property="og:site_name" content="Dream Wedding Day" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://dreamweddingday.com/" />
    <meta property="twitter:title" content="Dream Wedding Day - AI-Powered Wedding Planning Platform" />
    <meta property="twitter:description" content="Plan your perfect wedding with AI-powered photo analysis, seamless RSVP management, and real-time coordination tools." />
    <meta property="twitter:image" content="https://dreamweddingday.com/og-image.jpg" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#ec4899" />
    <meta name="msapplication-TileColor" content="#ec4899" />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
